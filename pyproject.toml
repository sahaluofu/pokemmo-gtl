[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemmo-gtl"
version = "0.1.0"
description = "Read-only PokeMMO GTL market research and price forecasting workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27", "pydantic>=2.7", "pyyaml>=6.0", "typer>=0.12",
  "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5", "lightgbm>=4.5",
  "statsmodels>=0.14", "fastapi>=0.115", "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6", "respx>=0.21"]

[project.scripts]
gtl = "pokemmo_gtl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokemmo_gtl = ["db/migrations/*.sql", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
basetemp = ".pytest_tmp"

[tool.ruff]
target-version = "py312"
cache-dir = ".ruff_cache"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
